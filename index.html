<html lang="pt-PT">
<head>

<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --muted: #6e6e73;
  --faint: #c7c7cc;
  --line: rgba(60,60,67,.14);
  --green: #1f9d55;
  --green-soft: rgba(31,157,85,.14);
  --accent: #2f7d5b;
  --red: #d93a32;
  --red-soft: rgba(217,58,50,.12);
  --amber: #b7791f;
  --tab: rgba(249,249,249,.92);
  --switch-off: #e3e3e8;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --muted: #98989f;
    --faint: #48484a;
    --line: rgba(84,84,88,.6);
    --green: #34c76f;
    --green-soft: rgba(52,199,111,.18);
    --accent: #4cc38a;
    --red: #ff5f57;
    --red-soft: rgba(255,95,87,.16);
    --amber: #e0a43a;
    --tab: rgba(22,22,24,.92);
    --switch-off: #39393d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f; --faint: #48484a;
  --line: rgba(84,84,88,.6); --green: #34c76f; --green-soft: rgba(52,199,111,.18); --accent: #4cc38a;
  --red: #ff5f57; --red-soft: rgba(255,95,87,.16); --amber: #e0a43a; --tab: rgba(22,22,24,.92);
  --switch-off: #39393d; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
main { max-width: 640px; margin: 0 auto; padding: 0 16px; }
h1 { font-size: 34px; line-height: 1.1; letter-spacing: -.02em; margin: 14px 4px 14px; font-weight: 700; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 22px 16px 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.foot { font-size: 13px; color: var(--muted); margin: 7px 16px 0; }
.foot.warn { color: var(--red); }
.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.pad { padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 48px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: 0.5px solid var(--line); }
.row.plain + .row.plain::before { left: 16px; }
.row .grow { flex: 1; min-width: 0; }
.row .ico { width: 26px; text-align: center; font-size: 19px; flex: none; }
.tap { background: none; border: 0; width: 100%; text-align: left; }
.tap:active { background: var(--line); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label-sm { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.strike { text-decoration: line-through; color: var(--muted); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--faint); flex: none; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check.on { background: var(--green); border-color: var(--green); }
.check.on::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }

/* switch */
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--switch-off); border-radius: 31px; transition: background .2s; }
.switch span::after { content: ""; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* stepper */
.stepper { display: flex; align-items: center; gap: 0; background: var(--switch-off); border-radius: 9px; flex: none; }
.stepper button { width: 44px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; }
.stepper button:active { opacity: .5; }
.stepper button + button { border-left: 1px solid var(--line); }
.count { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 22px; text-align: right; }
.count.bad { color: var(--red); }

/* day switcher */
.dayswitch { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px; }
.dayswitch button.arrow { width: 44px; height: 44px; border-radius: 22px; border: 0; background: none; color: var(--accent); font-size: 26px; }
.dayswitch button.arrow:active { background: var(--line); }
.dayswitch .mid { text-align: center; }
.dayswitch .date { font-weight: 600; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 10px; background: var(--green); color: #fff; vertical-align: 2px; }
.pill.ghost { background: var(--green-soft); color: var(--green); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }

.dots { display: inline-flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: block; opacity: .55; }
.dots i.on { background: var(--green); opacity: 1; }

/* week summary */
.week { display: flex; gap: 16px; align-items: center; }
.ring { width: 82px; height: 82px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1; }
.ring .num b { font-size: 24px; font-variant-numeric: tabular-nums; display: block; }
.ring .num small { font-size: 11px; color: var(--muted); }
.week h3 { margin: 0 0 4px; font-size: 17px; }
.week p { margin: 2px 0; font-size: 15px; color: var(--muted); }
.week p.bad { color: var(--red); }

input.num-in { width: 80px; border: 0; background: none; text-align: right; font-variant-numeric: tabular-nums; outline: none; padding: 4px 0; }
input.num-in::placeholder { color: var(--faint); }
textarea { width: 100%; border: 0; background: none; resize: none; outline: none; min-height: 24px; padding: 0; }
textarea::placeholder, input::placeholder { color: var(--faint); }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 4px; }
.stats .v { font-size: 22px; font-variant-numeric: tabular-nums; }
.stats .v.big { font-size: 30px; font-weight: 700; }
.bar { height: 8px; border-radius: 4px; background: var(--switch-off); overflow: hidden; margin: 14px 0 8px; }
.bar > div { height: 100%; background: var(--green); border-radius: 4px; transition: width .3s; }
.between { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.info { display: flex; gap: 8px; font-size: 15px; margin-top: 8px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
.empty .big { font-size: 34px; margin-bottom: 6px; }

/* menu */
.daycard { margin-bottom: 14px; scroll-margin-top: 12px; }
.daycard.today { outline: 2px solid var(--green); outline-offset: -2px; }

/* shopping */
.del { border: 0; background: none; color: var(--faint); font-size: 22px; width: 36px; height: 36px; border-radius: 18px; flex: none; }
.del:active { background: var(--red-soft); color: var(--red); }
.addform { display: flex; gap: 8px; padding: 10px 12px; align-items: center; }
.addform input { flex: 1; min-width: 0; border: 0; background: var(--bg); border-radius: 9px; padding: 9px 11px; outline: none; }
.addform input.q { flex: 0 0 34%; }
.btn { border: 0; background: var(--green); color: #fff; font-weight: 600; border-radius: 10px; padding: 9px 14px; flex: none; }
.btn:active { opacity: .7; }
.btn.secondary { background: var(--green-soft); color: var(--green); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
.actions { display: block; }
.actions .row { color: var(--accent); }
.actions .row.danger { color: var(--red); }

.rule-n { width: 24px; height: 24px; border-radius: 12px; background: var(--green-soft); color: var(--green); font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; }
.rowtop { align-items: flex-start; }

/* tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--tab);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--line);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .inner { display: flex; width: 100%; max-width: 640px; }
nav.tabs button { flex: 1; border: 0; background: none; padding: 7px 0 6px; color: var(--muted); font-size: 10px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-current="page"] { color: var(--green); }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: rgba(40,40,42,.94); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 15px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.install { background: var(--green-soft); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-top: 4px; }
.install b { color: var(--green); }

/* refeições editáveis */
.mealrow { display: flex; align-items: flex-start; position: relative; }
.mealrow + .mealrow::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: 0.5px solid var(--line); }
.mealrow .tap { display: flex; gap: 12px; align-items: flex-start; padding: 11px 4px 11px 16px; flex: 1; min-width: 0; }
.editbtn { border: 0; background: none; color: var(--accent); width: 46px; height: 46px; margin: 4px 4px 0 0; border-radius: 23px; flex: none; font-size: 19px; }
.editbtn:active { background: var(--line); }
.kcal { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--green-soft); color: var(--green); margin-left: 6px; vertical-align: 1px; }
.tag.out { background: rgba(183,121,31,.15); color: var(--amber); }
.orig { font-size: 13px; color: var(--muted); margin-top: 2px; }
.kbar { height: 10px; border-radius: 5px; background: var(--switch-off); overflow: hidden; margin: 10px 0 6px; position: relative; }
.kbar > div { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; }
.kbar .plan { background: var(--green-soft); }
.kbar .eat { background: var(--green); }
.kbar.over .eat { background: var(--amber); }
.bigk { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* folha (bottom sheet) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 30; opacity: 0; transition: opacity .2s; }
.sheet-bg.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; top: max(env(safe-area-inset-top), 28px); z-index: 31; background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 640px; margin: 0 auto; }
.sheet.open { transform: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.sheet-head h2 { font-size: 18px; margin: 0; flex: 1; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); flex: 1; }
.closebtn { border: 0; background: var(--switch-off); color: var(--muted); width: 30px; height: 30px; border-radius: 15px; font-size: 17px; line-height: 1; }
.seg { display: flex; background: var(--switch-off); border-radius: 9px; padding: 2px; margin: 4px 0 12px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.search { width: 100%; border: 0; background: var(--card); border-radius: 10px; padding: 10px 12px; outline: none; font-size: 17px; }
.field { width: 100%; border: 0; background: var(--card); border-radius: 10px; padding: 10px 12px; outline: none; }
textarea.field { min-height: 90px; resize: vertical; }
.addbtn { border: 0; background: var(--green-soft); color: var(--green); width: 34px; height: 34px; border-radius: 17px; font-size: 20px; font-weight: 600; flex: none; }
.cat { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding: 12px 16px 4px; }
.qty { min-width: 30px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.savebar { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
.btn.full { width: 100%; padding: 13px; font-size: 17px; }
.btn:disabled { opacity: .4; }
body.locked { overflow: hidden; }
</style>
</head>

/* ---------- Datas ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); r.setHours(0, 0, 0, 0); return r; };
const isoWd = d => (d.getDay() + 6) % 7 + 1; // 1 = segunda … 7 = domingo
const weekStart = d => addDays(d, -(isoWd(d) - 1));
const sameDay = (a, b) => keyOf(a) === keyOf(b);
const fmtLong = d => { const s = d.toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" }); return s.charAt(0).toUpperCase() + s.slice(1); };
const fmtShort = d => d.toLocaleDateString("pt-PT", { day: "numeric", month: "short" }).replace(".", "");
const kg = v => Number(v).toLocaleString("pt-PT", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseNum = s => { const v = parseFloat(String(s).replace(",", ".").trim()); return isFinite(v) ? v : null; };

const blankLog = () => ({ menu: false, sweets: false, beers: 0, walk: false, weight: null, notes: "", meals: [false, false, false, false, false], custom: {}, extras: [] });
const getLog = k => Object.assign(blankLog(), state.logs[k] || {});
function setLog(k, patch) {
  const old = getLog(k);
  const next = Object.assign(old, patch);
  // Todas as refeições feitas e nenhuma "comida fora" → cumpriu a ementa.
  if (patch.meals && next.meals.every(Boolean) && !Object.values(next.custom || {}).some(c => c.mode === "eaten")) next.menu = true;
  state.logs[k] = next;
  save();
}
/* Refeição efetiva de um dia: a da ementa ou a que foi trocada/escrita/comida. */
function mealOf(log, d, i) {
  const wd = isoWd(d) - 1, c = (log.custom || {})[i];
  const base = { text: MENU[wd][i], kcal: MENU_KCAL[wd][i], changed: false };
  if (!c) return base;
  return { text: c.text, kcal: c.kcal == null ? null : c.kcal, changed: true, mode: c.mode, fromDay: c.fromDay, items: c.items, orig: base.text };
}
function dayKcal(log, d) {
  let eaten = 0, planned = 0, unknown = 0;
  for (let i = 0; i < 5; i++) {
    const m = mealOf(log, d, i);
    if (m.kcal == null) { unknown++; continue; }
    planned += m.kcal; if (log.meals[i]) eaten += m.kcal;
  }
  const extras = (log.extras || []).reduce((a, x) => a + x.k * x.q, 0), beers = (log.beers || 0) * BEER_KCAL;
  return { eaten: eaten + extras + beers, planned: planned + extras + beers, extras, beers, unknown };
}
const hasMealsDone = log => (log.meals || []).some(Boolean) || (log.extras || []).length > 0;
const beerDay = d => { const w = isoWd(d); return w === 3 || w >= 6; };
const beerOK = (log, d) => log.beers === 0 || (beerDay(d) && log.beers <= 2);
const points = (log, d) => [log.menu, log.sweets, log.walk, beerOK(log, d)].filter(Boolean).length;
const startDate = () => parseKey(state.settings.start);

function weekPoints(date) {
  const ws = weekStart(date), t = today(), st = startDate();
  let p = 0, max = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d > t || d < st) continue;
    p += points(getLog(keyOf(d)), d); max += 4;
  }
  return { p, max };
}
function weekBeers(date) {
  const ws = weekStart(date); let b = 0;
  for (let i = 0; i < 7; i++) b += getLog(keyOf(addDays(ws, i))).beers || 0;
  return b;
}
function weighIns() {
  return Object.entries(state.logs)
    .filter(([, l]) => typeof l.weight === "number")
    .map(([k, l]) => ({ k, d: parseKey(k), w: l.weight }))
    .sort((a, b) => a.d - b.d);
}
const currentWeight = () => { const w = weighIns(); return w.length ? w[w.length - 1].w : state.settings.initial; };
function weeklyRate() {
  const st = startDate();
  let pts = weighIns().map(x => ({ d: x.d, w: x.w }));
  if (!pts.length) return null;
  if (pts[0].d > st) pts.unshift({ d: st, w: state.settings.initial });
  const a = pts[0], b = pts[pts.length - 1];
  const days = Math.round((b.d - a.d) / 864e5);
  if (days < 7) return null;
  return (a.w - b.w) / days * 7;
}
function perfectStreak() {
  let d = today(), n = 0;
  if (points(getLog(keyOf(d)), d) < 4) d = addDays(d, -1);
  while (d >= startDate() && points(getLog(keyOf(d)), d) === 4) { n++; d = addDays(d, -1); }
  return n;
}

function weekCard(date) {
  const s = state.settings, wk = weekPoints(date), beers = weekBeers(date);
  const C = 2 * Math.PI * 34, frac = Math.min(1, wk.p / 28), gFrac = s.weekGoal / 28;
  const ok = wk.p >= s.weekGoal;
  const t = today(), inWeek = sameDay(weekStart(date), weekStart(t));
  const todayLeft = inWeek && t >= startDate() ? 4 - points(getLog(keyOf(t)), t) : 0;
  const left = 28 - wk.max + todayLeft, need = s.weekGoal - wk.p;
  const pl = n => n === 1 ? "1 ponto" : `${n} pontos`;
  const msg = ok ? `Meta de ${s.weekGoal} pontos atingida 💪` :
    need > left ? `${need === 1 ? "Falta" : "Faltam"} ${pl(need)} para a meta de ${s.weekGoal}. Já não dá esta semana, mas cada ponto conta.` :
    `${need === 1 ? "Falta" : "Faltam"} ${pl(need)} para a meta de ${s.weekGoal}.`;
  return `<div class="card pad week">
    <div class="ring">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--switch-off)" stroke-width="9"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--green)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" opacity="${ok ? 1 : .8}"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--text)" stroke-width="13" opacity=".55"
          stroke-dasharray="1.6 ${C.toFixed(1)}" stroke-dashoffset="${(-C * gFrac + .8).toFixed(1)}"/>
      </svg>
      <div class="num"><div><b>${wk.p}</b><small>/ 28</small></div></div>
    </div>
    <div>
      <h3>${sameDay(weekStart(date), weekStart(today())) ? "Esta semana" : "Semana de " + fmtShort(weekStart(date))}</h3>
      <p>${msg}</p>
      <p class="${beers > s.maxBeers ? "bad" : ""}">🍺 Cervejas: ${beers} de ${s.maxBeers}</p>
    </div>
  </div>`;
}

/* --- Progresso --- */
function weightChart() {
  const s = state.settings, st = startDate();
  const pts = [{ d: st, w: s.initial }].concat(weighIns().filter(x => x.d > st));
  if (pts.length < 2) return `<div class="empty"><div class="big">⚖️</div>Ainda sem pesagens.<br>O gráfico aparece depois da primeira.</div>`;
  const W = 340, H = 200, L = 34, R = 10, T = 14, B = 24;
  const all = pts.map(p => p.w).concat([s.goal]);
  const lo = Math.floor(Math.min(...all) - 1), hi = Math.ceil(Math.max(...all) + 1);
  const t0 = +pts[0].d, t1 = Math.max(+pts[pts.length - 1].d, t0 + 864e5);
  const x = d => L + (W - L - R) * ((+d - t0) / (t1 - t0));
  const y = w => T + (H - T - B) * (1 - (w - lo) / (hi - lo));
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.w).toFixed(1)}`).join(" ");
  const ticks = []; const step = Math.max(1, Math.round((hi - lo) / 4));
  for (let v = lo; v <= hi; v += step) ticks.push(v);
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico da evolução do peso">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    <line x1="${L}" x2="${W - R}" y1="${y(s.goal)}" y2="${y(s.goal)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - R}" y="${y(s.goal) - 5}" text-anchor="end" style="fill:var(--green)">meta ${kg(s.goal)}</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${x(p.d)}" cy="${y(p.w)}" r="3.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${x(last.d)}" y="${y(last.w) - 9}" text-anchor="${pts.length > 1 ? "end" : "middle"}" style="fill:var(--text);font-weight:600">${kg(last.w)}</text>
    <text x="${L}" y="${H - 6}">${fmtShort(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(last.d)}</text>
  </svg>`;
}
function weeksChart() {
  const g = state.settings.weekGoal, tw = weekStart(today()), firstW = weekStart(startDate());
  const weeks = [];
  for (let o = 7; o >= 0; o--) { const ws = addDays(tw, -7 * o); if (ws >= firstW) weeks.push({ ws, p: weekPoints(ws).p }); }
  const W = 340, H = 180, L = 8, R = 8, T = 26, B = 22, n = weeks.length;
  const bw = Math.min(30, (W - L - R) / n * .6), gap = (W - L - R) / n;
  const y = v => T + (H - T - B) * (1 - v / 28);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pontos por semana">
    <line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--muted)" stroke-dasharray="5 4" stroke-width="1"/>
    <text x="${W - R}" y="${y(g) - 4}" text-anchor="end">meta ${g}</text>
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    ${weeks.map((w, i) => { const cx = L + gap * i + gap / 2, top = y(w.p);
      return `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${Math.max(0, y(0) - top)}" rx="4" fill="${w.p >= g ? "var(--green)" : "var(--accent)"}" opacity="${w.p >= g ? 1 : .45}"/>
      <text x="${cx}" y="${top - 4}" text-anchor="middle" style="fill:var(--text)">${w.p}</text>
      <text x="${cx}" y="${H - 6}" text-anchor="middle">${fmtShort(w.ws)}</text>`; }).join("")}
  </svg>`;
}
function renderProgresso() {
  const s = state.settings, cur = currentWeight(), lost = s.initial - cur, rem = Math.max(0, cur - s.goal);
  const prog = s.initial > s.goal ? Math.max(0, Math.min(1, lost / (s.initial - s.goal))) : 0;
  const rate = weeklyRate();
  let rateHtml = `<div class="foot" style="margin:10px 0 0">Regista o peso às segundas-feiras. Ao fim de uma semana aparece o ritmo e a data prevista para chegar à meta.</div>`;
  if (rate != null) {
    rateHtml = `<div class="info"><span>⏱️</span><span>${rate > 0 ? `Ritmo: −${kg(rate)} kg por semana` : "Sem descida desde o início. Revê o registo da semana."}</span></div>`;
    if (rate > 0.05 && rem > 0) {
      const wi = weighIns(); const base = wi.length ? wi[wi.length - 1].d : today();
      const eta = addDays(base, Math.ceil(rem / rate * 7));
      rateHtml += `<div class="info" style="color:var(--green)"><span>🏁</span><span>A este ritmo chegas aos ${kg(s.goal)} kg por volta de <b>${eta.toLocaleDateString("pt-PT", { day: "numeric", month: "long", year: "numeric" })}</b></span></div>`;
    }
    if (rate > 1) rateHtml += `<div class="foot" style="margin:8px 0 0">Mais de 1 kg por semana é rápido. Um ritmo de 0,5 a 1 kg é mais fácil de manter.</div>`;

  const days = Object.keys(state.logs).sort().reverse();
  view.innerHTML = `
    <h1>Progresso</h1>
    <div class="card pad">
      <div class="stats">
        <div><div class="small muted">Inicial</div><div class="v">${kg(s.initial)}</div><div class="small muted">kg</div></div>
        <div><div class="small muted">Atual</div><div class="v big">${kg(cur)}</div><div class="small muted">kg</div></div>
        <div><div class="small muted">Meta</div><div class="v">${kg(s.goal)}</div><div class="small muted">kg</div></div>
      </div>
      <div class="bar" role="progressbar" aria-valuenow="${Math.round(prog * 100)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${(prog * 100).toFixed(1)}%"></div></div>
      <div class="between"><b>${lost >= 0 ? `Já perdi ${kg(lost)} kg` : `Ganhei ${kg(-lost)} kg`}</b><span class="muted">${rem > 0 ? `Faltam ${kg(rem)} kg` : "Meta atingida 🎉"}</span></div>
      ${rateHtml}
      ${(() => { const ks = Object.keys(state.logs).sort().reverse().filter(k => hasMealsDone(getLog(k)) && parseKey(k) <= today()).slice(0, 7);
        if (!ks.length) return "";
        const avg = ks.reduce((a, k) => a + dayKcal(getLog(k), parseKey(k)).eaten, 0) / ks.length;
        return `<div class="info"><span>🔥</span><span>Média de calorias (últimos ${ks.length} dias registados): <b>≈ ${kc(avg)} kcal</b> / meta ${kc(state.settings.kcal || 2000)}</span></div>`; })()}
    </div>

    <div class="section-title"><span>Evolução do peso</span></div>
    <div class="card pad">${weightChart()}</div>

    <div class="section-title"><span>Pontos por semana</span></div>
    <div class="card pad">${weeksChart()}</div>

    <div class="section-title"><span>Histórico</span><span>🔥 ${perfectStreak()} dias seguidos com 4/4</span></div>
    <div class="card">
      ${days.length ? days.map(k => { const d = parseKey(k), l = getLog(k);
        return `<button class="row tap plain" data-goto="${k}">
          <div class="grow"><div>${fmtLong(d)}</div>${l.notes ? `<div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.notes)}</div>` : ""}</div>

          ${d > today() ? "" : dots(points(l, d))}

}

/* ---------- Ficheiros ---------- */
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function csv() {
  const rows = [["Data", "Cumpri a ementa", "Doces só os planeados", "Cervejas", "Caminhei 30 min", "Pontos", "Peso (kg)", "Calorias (kcal)", "Refeições alteradas", "Notas"]];
  Object.keys(state.logs).sort().forEach(k => {
    const l = getLog(k), d = parseKey(k);
    rows.push([k, l.menu ? "Sim" : "Não", l.sweets ? "Sim" : "Não", l.beers, l.walk ? "Sim" : "Não", points(l, d), l.weight == null ? "" : kg(l.weight), Math.round(dayKcal(l, d).eaten),
      Object.entries(l.custom || {}).map(([i, c]) => `${MEALS[i].n}: ${c.text}`).join(" | ").replace(/[;\n\r]/g, " "),
      (l.notes || "").replace(/[;\n\r]/g, " ")]);
  });
  return "﻿" + rows.map(r => r.join(";")).join("\n");
}

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (tab === b.dataset.tab && tab === "hoje") selected = today();
  tab = b.dataset.tab;
  try { sessionStorage.setItem("tab", tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
  if (tab === "ementa") { const el = document.getElementById("day-" + (isoWd(today()) - 1)); if (el) el.scrollIntoView({ block: "start" }); }
});

view.addEventListener("click", async e => {
  const t = e.target;
  const meal = t.closest("[data-meal]");
  if (meal) { const k = keyOf(selected), l = getLog(k), i = +meal.dataset.meal; l.meals[i] = !l.meals[i]; setLog(k, { meals: l.meals }); render(); return; }
  const shop = t.closest("[data-shop]");
  if (shop) { const it = state.shopping.find(x => x.id === shop.dataset.shop); if (it) { it.bought = !it.bought; save(); render(); } return; }
  const del = t.closest("[data-delshop]");
  if (del) { const it = state.shopping.find(x => x.id === del.dataset.delshop); if (it && confirm(`Apagar "${it.name}" da lista?`)) { state.shopping = state.shopping.filter(x => x !== it); save(); render(); } return; }
  const em = t.closest("[data-editmeal]");
  if (em) { openSheet(+em.dataset.editmeal); return; }
  const dx = t.closest("[data-delextra]");
  if (dx) { const k = keyOf(selected), l = getLog(k), ex = l.extras.slice(); ex.splice(+dx.dataset.delextra, 1); setLog(k, { extras: ex }); render(); return; }
  const go = t.closest("[data-goto]");
  if (go) { selected = parseKey(go.dataset.goto); tab = "hoje"; render(); window.scrollTo(0, 0); return; }
  const act = t.closest("[data-act]"); if (!act) return;
  const k = keyOf(selected);
  switch (act.dataset.act) {
    case "prev": selected = addDays(selected, -1); render(); break;
    case "next": selected = addDays(selected, 1); render(); break;
    case "today": selected = today(); render(); break;
    case "addextra": openSheet("extra"); break;
    case "beer+": setLog(k, { beers: Math.min(12, getLog(k).beers + 1) }); render(); break;
    case "beer-": setLog(k, { beers: Math.max(0, getLog(k).beers - 1) }); render(); break;
    case "share": {
      const text = "Lista de compras\n" + state.shopping.filter(x => !x.bought).map(x => `• ${x.name}${x.qty ? " — " + x.qty : ""}`).join("\n");
      try {
        if (navigator.share) await navigator.share({ text });
        else { await navigator.clipboard.writeText(text); toast("Lista copiada"); }
      } catch (err) { if (err.name !== "AbortError") toast("Não foi possível partilhar"); }
      break;
    }
    case "unbuyall": state.shopping.forEach(x => x.bought = false); save(); render(); toast("Lista pronta para a nova semana"); break;
    case "resetshop": if (confirm("Repor a lista original? Os produtos que adicionaste são apagados.")) { state.shopping = defaultShopping(); save(); render(); } break;
    case "backup": await shareFile(`plano-copia-${keyOf(today())}.json`, JSON.stringify(state, null, 1), "application/json"); break;
    case "restore": document.getElementById("restoreFile").click(); break;
    case "csv": await shareFile(`registo-${keyOf(today())}.csv`, csv(), "text/csv"); break;
    case "wipe": if (confirm("Apagar o registo, o peso e a lista de compras? Não dá para desfazer.")) { state = defaultState(); save(); selected = today(); render(); toast("Dados apagados"); } break;
  }
});

});
view.addEventListener("input", e => {
  if (e.target.id === "notes") { autoGrow(e.target); setLog(keyOf(selected), { notes: e.target.value }); }
});
view.addEventListener("submit", e => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const f = e.target, name = f.elements.namedItem("item").value.trim(), qty = f.elements.qty.value.trim();
  if (!name) { f.elements.namedItem("item").focus(); return; }
  state.shopping.unshift({ id: "u" + Date.now(), name, qty, bought: false });
  save(); render(); toast("Adicionado");
  const nf = document.getElementById("addForm"); if (nf) nf.elements.namedItem("item").focus();
});
document.getElementById("restoreFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!s || typeof s.logs !== "object" || !s.settings) throw new Error("formato");
    if (!confirm("Substituir os dados atuais por esta cópia?")) return;
    const d = defaultState();
    state = { logs: s.logs, shopping: Array.isArray(s.shopping) ? s.shopping : d.shopping, settings: Object.assign(d.settings, s.settings) };
    save(); render(); toast("Cópia restaurada");
  } catch (err) { toast("Ficheiro inválido"); }
});

// Mudança de dia com a app aberta (ex.: depois da meia-noite)
let lastDay = keyOf(today());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && keyOf(today()) !== lastDay) {
    if (keyOf(selected) === lastDay) selected = today();
    lastDay = keyOf(today()); render();
  }
});

/* ---------- Folha: trocar / o que comi / escrever ---------- */
const sheetEl = document.getElementById("sheet"), sheetBg = document.getElementById("sheetBg");
let sh = null;

function openSheet(target) {
  const log = getLog(keyOf(selected));
  const isExtra = target === "extra";
  const cur = isExtra ? null : mealOf(log, selected, target);
  sh = {
    target, isExtra,
    tab: isExtra ? "eat" : (cur.changed && cur.mode === "eaten" ? "eat" : cur.changed && cur.mode === "edit" ? "write" : "swap"),
    q: "",
    items: cur && cur.mode === "eaten" && cur.items ? cur.items.map(x => ({ ...x })) : [],
    text: cur && cur.changed && cur.mode === "edit" ? cur.text : "",
    kcal: cur && cur.changed && cur.mode === "edit" && cur.kcal != null ? String(cur.kcal) : "",
    cn: "", ck: ""
  };
  sheetEl.hidden = false; sheetBg.hidden = false;
  renderSheet();
  document.body.classList.add("locked");
  requestAnimationFrame(() => { sheetEl.classList.add("open"); sheetBg.classList.add("open"); });
}
function closeSheet() {
  sheetEl.classList.remove("open"); sheetBg.classList.remove("open");
  document.body.classList.remove("locked");
  setTimeout(() => { sheetEl.hidden = true; sheetBg.hidden = true; sheetEl.innerHTML = ""; }, 280);
  sh = null;
}
const itemsTotal = () => sh.items.reduce((a, x) => a + x.k * x.q, 0);

function foodResults() {
  const q = norm(sh.q.trim());
  const list = FOODS.map((f, i) => ({ f, i })).filter(({ f }) => !q || q.split(/\s+/).every(w => norm(f[0] + " " + f[3]).includes(w)));
  if (!list.length) return `<div class="empty">Nada encontrado. Usa "Outro alimento" abaixo.</div>`;
  let cat = "", html = "";
  for (const { f, i } of list) {
    if (f[3] !== cat) { if (cat) html += "</div>"; cat = f[3]; html += `<div class="cat">${cat}</div><div class="card">`; }
    html += `<div class="row plain"><span class="grow">${esc(f[0])}<div class="kcal">${f[2]} · ${kc(f[1])} kcal</div></span><button class="addbtn" data-addfood="${i}" aria-label="Adicionar ${esc(f[0])}">+</button></div>`;
  }
  return html + "</div>";
}
function chosenHtml() {
  if (!sh.items.length) return `<div class="foot" style="margin:0 4px 10px">Procura e toca em + para juntar o que comeste. Ajusta as porções com − e +.</div>`;
  return `<div class="card" style="margin-bottom:12px">
    ${sh.items.map((x, j) => `<div class="row plain"><span class="grow">${esc(x.n)}<div class="kcal">${esc(x.p || "porção")} · ≈ ${kc(x.k * x.q)} kcal</div></span>
      <span class="qty">${fmtQ(x.q)}</span>
      <span class="stepper"><button data-qty="${j}" data-d="-0.5" aria-label="Menos">−</button><button data-qty="${j}" data-d="0.5" aria-label="Mais">+</button></span></div>`).join("")}
    <div class="row plain"><b class="grow">Total</b><b>≈ ${kc(itemsTotal())} kcal</b></div>
  </div>`;
}
function renderSheet() {
  if (!sh) return;
  const d = selected, wd = isoWd(d) - 1, log = getLog(keyOf(d));
  const title = sh.isExtra ? "Adicionar extra" : `${MEALS[sh.target].i} ${MEALS[sh.target].n} · ${DAYNAMES[wd].split(" ")[0]}`;
  const cur = sh.isExtra ? null : mealOf(log, d, sh.target);
  let body = "";
  if (!sh.isExtra) {
    body += `<div class="card pad" style="margin-bottom:10px"><div class="label-sm">${cur.changed ? "Agora" : "Previsto na ementa"}</div><div>${esc(cur.text)}</div>
      <div class="kcal">${cur.kcal == null ? "kcal por indicar" : "≈ " + kc(cur.kcal) + " kcal"}</div>
      ${cur.changed ? `<button class="linkbtn" data-sact="reset" style="padding:8px 0 0">↺ Repor a da ementa</button>` : ""}</div>
      <div class="seg" role="group" aria-label="Como alterar">
        <button data-stab="swap" aria-pressed="${sh.tab === "swap"}">Trocar</button>
        <button data-stab="eat" aria-pressed="${sh.tab === "eat"}">O que comi</button>
        <button data-stab="write" aria-pressed="${sh.tab === "write"}">Escrever</button>
      </div>`;
  }
  if (sh.tab === "swap") {
    body += `<div class="foot" style="margin:0 4px 8px">Troca pelo ${MEALS[sh.target].n.toLowerCase()} de outro dia da semana:</div><div class="card">` +
      MENU.map((day, di) => di === wd ? "" : `<button class="row tap plain rowtop" data-swap="${di}">
        <span class="grow"><div class="label-sm">${DAYNAMES[di]}</div><div>${esc(day[sh.target])}</div><div class="kcal">≈ ${kc(MENU_KCAL[di][sh.target])} kcal</div></span><span class="muted">›</span></button>`).join("") + `</div>`;
  } else if (sh.tab === "eat") {
    body += `<div id="chosen">${chosenHtml()}</div>
      <input class="search" id="foodSearch" type="search" placeholder="Procurar: prato do dia, bitoque, sandes…" value="${esc(sh.q)}" autocomplete="off" enterkeyhint="search">
      <div class="cat">Outro alimento</div>
      <div class="card addform">
        <input id="cName" placeholder="Nome" value="${esc(sh.cn)}" aria-label="Nome do alimento">
        <input id="cKcal" class="q" placeholder="kcal" inputmode="numeric" value="${esc(sh.ck)}" aria-label="Calorias">
        <button class="addbtn" data-sact="addcustom" aria-label="Adicionar alimento">+</button>
      </div>
      <div id="foodResults">${foodResults()}</div>
      <div class="savebar"><button class="btn full" data-sact="saveeat" ${sh.items.length ? "" : "disabled"}>${sh.isExtra ? "Adicionar" : "Guardar"}${sh.items.length ? ` · ≈ ${kc(itemsTotal())} kcal` : ""}</button></div>`;
  } else {
    body += `<textarea class="field" id="wText" placeholder="Ex.: Prato do dia na cantina — frango grelhado com arroz e salada">${esc(sh.text)}</textarea>
      <div class="card addform" style="margin-top:10px"><span class="grow">Calorias (opcional)</span><input id="wKcal" class="q" inputmode="numeric" placeholder="kcal" value="${esc(sh.kcal)}" aria-label="Calorias"></div>
      <div class="foot" style="margin:6px 4px 0">Não sabes as calorias? Usa "O que comi" para as calcular.</div>
      <div class="savebar"><button class="btn full" data-sact="savewrite">Guardar</button></div>`;
  }
  sheetEl.innerHTML = `<div class="sheet-head"><h2 id="sheetTitle">${title}</h2><button class="closebtn" data-sact="close" aria-label="Fechar">✕</button></div><div class="sheet-body">${body}</div>`;
}
function refreshEat() {
  const c = document.getElementById("chosen"); if (c) c.innerHTML = chosenHtml();
  const b = sheetEl.querySelector('[data-sact="saveeat"]');
  if (b) { b.disabled = !sh.items.length; b.textContent = (sh.isExtra ? "Adicionar" : "Guardar") + (sh.items.length ? ` · ≈ ${kc(itemsTotal())} kcal` : ""); }
}
function applyMeal(custom, markDone) {
  const k = keyOf(selected), l = getLog(k), c = Object.assign({}, l.custom);
  if (custom) c[sh.target] = custom; else delete c[sh.target];
  const patch = { custom: c };
  if (markDone) { const m = l.meals.slice(); m[sh.target] = true; patch.meals = m; }
  setLog(k, patch);
}

sheetBg.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && sh) closeSheet(); });
sheetEl.addEventListener("input", e => {
  if (!sh) return;
  const t = e.target;
  if (t.id === "foodSearch") { sh.q = t.value; document.getElementById("foodResults").innerHTML = foodResults(); }
  else if (t.id === "wText") sh.text = t.value;
  else if (t.id === "wKcal") sh.kcal = t.value;
  else if (t.id === "cName") sh.cn = t.value;
  else if (t.id === "cKcal") sh.ck = t.value;
});
sheetEl.addEventListener("click", e => {
  if (!sh) return;
  const t = e.target;
  const st = t.closest("[data-stab]"); if (st) { sh.tab = st.dataset.stab; renderSheet(); return; }
  const swp = t.closest("[data-swap]");
  if (swp) { const di = +swp.dataset.swap; applyMeal({ mode: "swap", text: MENU[di][sh.target], kcal: MENU_KCAL[di][sh.target], fromDay: di }, false); toast(`Trocado pelo de ${DAYNAMES[di].split(" ")[0].toLowerCase()}`); closeSheet(); render(); return; }
  const af = t.closest("[data-addfood]");
  if (af) { const f = FOODS[+af.dataset.addfood], ex = sh.items.find(x => x.n === f[0]);
    if (ex) ex.q += 1; else sh.items.push({ n: f[0], k: f[1], p: f[2], q: 1 });
    refreshEat(); toast(`${f[0]} adicionado`); return; }
  const qb = t.closest("[data-qty]");
  if (qb) { const j = +qb.dataset.qty; sh.items[j].q = Math.max(0, sh.items[j].q + parseFloat(qb.dataset.d)); if (!sh.items[j].q) sh.items.splice(j, 1); refreshEat(); return; }
  const a = t.closest("[data-sact]"); if (!a) return;
  switch (a.dataset.sact) {
    case "close": closeSheet(); break;
    case "reset": applyMeal(null, false); toast("Reposta a refeição da ementa"); closeSheet(); render(); break;
    case "addcustom": {
      const n = sh.cn.trim(), k = parseNum(sh.ck);
      if (!n || k == null || k < 0) { toast("Indica o nome e as kcal"); return; }
      sh.items.push({ n, k: Math.round(k), p: "porção", q: 1 }); sh.cn = ""; sh.ck = "";
      document.getElementById("cName").value = ""; document.getElementById("cKcal").value = "";
      refreshEat(); break;
    }
    case "saveeat": {
      if (!sh.items.length) return;
      if (sh.isExtra) {
        const k = keyOf(selected), l = getLog(k);
        setLog(k, { extras: (l.extras || []).concat(sh.items.map(x => ({ n: x.n, k: x.k, q: x.q }))) });
        toast("Extra adicionado");
      } else {
        const text = sh.items.map(x => (x.q !== 1 ? fmtQ(x.q) + "× " : "") + x.n).join(" + ");
        applyMeal({ mode: "eaten", text, kcal: Math.round(itemsTotal()), items: sh.items }, true);
        toast("Refeição registada");
      }
      closeSheet(); render(); break;
    }
    case "savewrite": {
      const text = sh.text.trim(); if (!text) { toast("Escreve o que comeste"); return; }
      const k = parseNum(sh.kcal);
      applyMeal({ mode: "edit", text, kcal: k == null ? null : Math.round(k) }, false);
      toast("Refeição alterada"); closeSheet(); render(); break;
    }
  }
});

render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
